<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HitmAAN Voice Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(160deg, #6a11cb 0%, #2575fc 100%);
      color: #f0f0f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      background: #1e202a;
      border-radius: 20px;
      width: 950px;
      max-width: 95vw;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(18, 25, 36, 0.85);
      display: flex;
      flex-direction: column;
      height: 90vh;
    }

    #statusBar {
      margin-bottom: 12px;
      font-size: 1.05rem;
      color: #a5b3d4;
      text-align: center;
      height: 26px;
    }

    #skillHint {
      font-size: 1rem;
      color: #95cffb;
      margin-bottom: 8px;
      text-align: center;
    }

    #btnContainer {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 24px;
      font-size: 1.05rem;
      font-weight: 600;
      background: linear-gradient(45deg, #7b2ff7, #f107a3);
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgb(247 7 163 / 0.4);
      transition: box-shadow 0.3s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Recording pulse glow */
    .recording {
      box-shadow: 0 0 15px 3px #f107a3;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.05);
      }
    }

    #chatHistory {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #1b1d29;
      border-radius: 14px;
      border: 1px solid #33384d;
      font-size: 1.05rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .chat-message {
      margin-bottom: 12px;
      padding: 14px 18px;
      border-radius: 14px;
      max-width: 75%;
      word-break: break-word;
    }

    .user-message {
      background: #2f2f65;
      align-self: flex-end;
    }

    .agent-message {
      background: #243649;
      align-self: flex-start;
      font-style: italic;
    }

    .agent-name {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      color: #f49ac1;
      font-style: normal;
    }

    @media (max-width: 600px) {
      .chat-message {
        max-width: 95%;
        font-size: 0.95rem;
      }
      button {
        font-size: 0.9rem;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="statusBar">Ready to record</div>
    <div id="skillHint">
      Try: <b>"Search the web for latest AI news"</b> or <b>"What's the weather?"</b>
    </div>
    <div id="btnContainer">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop Recording</button>
      <button id="downloadBtn" disabled>Download Chat</button>
    </div>
    <div id="chatHistory"></div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusBar = document.getElementById('statusBar');
    const chatHistory = document.getElementById('chatHistory');

    let ws, audioCtxMic, mediaStream, processor, source;
    let isRecording = false;
    const playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
    let nextAudioTime = playbackCtx.currentTime;

    let conversationLog = [];

    // ----- UI Helpers -----
    function setStatus(txt) {
      statusBar.textContent = txt;
    }

    function autoScroll() {
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function addMessage(text, sender = "user") {
      const div = document.createElement("div");
      div.className = "chat-message " + (sender === "user" ? "user-message" : "agent-message");

      if (sender === "agent") {
        const nameSpan = document.createElement("span");
        nameSpan.textContent = "HitmAAN 🤖";
        nameSpan.className = "agent-name";
        div.appendChild(nameSpan);
      }

      div.appendChild(document.createTextNode(text.trim()));
      chatHistory.appendChild(div);

      conversationLog.push({ role: sender, text: text.trim() });
      autoScroll();

      downloadBtn.disabled = conversationLog.length === 0;
      return div;
    }

    // ----- Audio Playback -----
    async function safeDecode(byteArray) {
      try {
        return await playbackCtx.decodeAudioData(byteArray.buffer);
      } catch (e) {
        console.warn("Skipping audio chunk decode error:", e);
        return null;
      }
    }

    async function playBase64Chunk(b64) {
      if (playbackCtx.state === "suspended") await playbackCtx.resume();

      const byteArray = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const audioBuffer = await safeDecode(byteArray);
      if (!audioBuffer) return;

      const src = playbackCtx.createBufferSource();
      src.buffer = audioBuffer;
      src.connect(playbackCtx.destination);

      src.start(nextAudioTime);
      nextAudioTime += audioBuffer.duration;

      src.onended = () => {
        if (Math.abs(playbackCtx.currentTime - nextAudioTime) < 0.05) {
          nextAudioTime = playbackCtx.currentTime;
        }
      };
    }

    // ----- Start Button -----
    startBtn.onclick = async () => {
      startBtn.disabled = true;
      startBtn.classList.add("recording");
      stopBtn.disabled = false;
      chatHistory.innerHTML = "";
      conversationLog = [];
      setStatus("Connecting...");

      ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/voice-agent"
      );
      ws.binaryType = "arraybuffer";

      ws.onopen = async () => {
        setStatus("Recording...");
        if (playbackCtx.state === "suspended") await playbackCtx.resume();
      };

      ws.onclose = () => {
        setStatus("Disconnected.");
        stopAudio();
        startBtn.disabled = false;
        stopBtn.disabled = true;
        isRecording = false;
        nextAudioTime = playbackCtx.currentTime;
        startBtn.classList.remove("recording");
      };

      ws.onmessage = (e) => {
        let msg;
        try {
          msg = JSON.parse(e.data);
        } catch (err) {
          console.error("Invalid WS message", e.data);
          return;
        }
        switch (msg.type) {
          case "partial":
            setStatus("Listening... " + msg.text);
            break;
          case "final":
            addMessage(msg.text, "user");
            setStatus("Processing...");
            break;
          case "llm_response":
            addMessage(msg.text, "agent");
            setStatus("HitmAAN responded.");
            break;
          case "murf_audio_chunk":
            playBase64Chunk(msg.audio_b64);
            break;
          case "audio_done":
            setStatus("Done speaking.");
            nextAudioTime = Math.max(playbackCtx.currentTime, nextAudioTime);
            break;
          case "audio_error":
            setStatus("Audio error: " + msg.error);
            break;
        }
      };

      // Mic Streaming Setup
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtxMic = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });

      source = audioCtxMic.createMediaStreamSource(mediaStream);
      processor = audioCtxMic.createScriptProcessor(1024, 1, 1);

      source.connect(processor);
      processor.connect(audioCtxMic.destination);

      processor.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        const input = e.inputBuffer.getChannelData(0);
        const buf = new ArrayBuffer(input.length * 2);
        const view = new DataView(buf);

        for (let i = 0; i < input.length; i++) {
          let s = Math.max(-1, Math.min(1, input[i]));
          view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }

        ws.send(buf);
      };

      isRecording = true;
    };

    // ----- Stop Button -----
    stopBtn.onclick = () => {
      if (!isRecording) return;

      setStatus("Stopping...");
      if (ws) {
        ws.onmessage = null; // Prevent more message handling after close
        if (ws.readyState === WebSocket.OPEN) ws.close();
        ws = null;
      }

      stopAudio();

      startBtn.disabled = false;
      startBtn.classList.remove("recording");
      stopBtn.disabled = true;
      isRecording = false;
      nextAudioTime = playbackCtx.currentTime;
    };

    // Stop audio + cleanup
    function stopAudio() {
      if (processor) {
        processor.disconnect();
        processor.onaudioprocess = null;
        processor = null;
      }
      if (source) source.disconnect();
      if (audioCtxMic) {
        audioCtxMic.close();
        audioCtxMic = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
    }

    // ----- Download Button -----
    downloadBtn.onclick = () => {
      if (conversationLog.length === 0) return;

      const txt = conversationLog
        .map(e => (e.role === "user" ? "👤 You: " : "🤖 HitmAAN: ") + e.text)
        .join("\n\n");

      const blob = new Blob([txt], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "conversation.txt";

      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    // --- Restore conversation from localStorage (optional)
    window.addEventListener("load", () => {
      const saved = localStorage.getItem("hitmaanChatLog");
      if (saved) {
        conversationLog = JSON.parse(saved);
        conversationLog.forEach(e => addMessage(e.text, e.role));
      }
    });

    window.addEventListener("beforeunload", () => {
      localStorage.setItem("hitmaanChatLog", JSON.stringify(conversationLog));
    });
  </script>
</body>
</html>
